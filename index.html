<!doctype html>

    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Decodes the path 404.html redirected here with, restoring the real
      // URL before React Router mounts.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Google tag (gtag.js) — dataLayer/gtag() are defined immediately so any
         early tracking calls still queue correctly. The actual GTM script AND
         the Tawk.to chat widget were previously the two biggest main-thread
         blockers on mobile (Lighthouse measured ~1.8s + ~0.65s of blocking
         time from them, loading eagerly on every visit before a user had done
         anything). Both are now deferred until the page is idle for a few
         seconds OR the user actually interacts, whichever comes first — real
         visitors get the same widgets within moments, but initial render is
         no longer competing with them for the main thread. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Z9G4KKW4FM');

      function loadDeferredScripts() {
        var gtm = document.createElement('script');
        gtm.async = true;
        gtm.src = 'https://www.googletagmanager.com/gtag/js?id=G-Z9G4KKW4FM';
        document.head.appendChild(gtm);

        window.Tawk_API = window.Tawk_API || {};
        window.Tawk_LoadStart = new Date();
        var tawk = document.createElement('script');
        tawk.async = true;
        tawk.src = 'https://embed.tawk.to/6a13d5bc83cf321c3962e34c/1jpenlr2g';
        tawk.charset = 'UTF-8';
        tawk.setAttribute('crossorigin', '*');
        document.body.appendChild(tawk);
      }

      var deferredScriptsLoaded = false;
      var deferredFallbackTimer;
      var deferredInteractionEvents = ['scroll', 'mousemove', 'touchstart', 'keydown', 'click'];
      function triggerDeferredLoad() {
        if (deferredScriptsLoaded) return;
        deferredScriptsLoaded = true;
        clearTimeout(deferredFallbackTimer);
        deferredInteractionEvents.forEach(function (evt) {
          window.removeEventListener(evt, triggerDeferredLoad);
        });
        loadDeferredScripts();
      }
      window.addEventListener('load', function () {
        deferredFallbackTimer = setTimeout(triggerDeferredLoad, 4000);
        deferredInteractionEvents.forEach(function (evt) {
          window.addEventListener(evt, triggerDeferredLoad, { once: true, passive: true });
        });
      });
    </script>
  </head>
